services:
  pi:
    build: .
    image: pitato:latest
    env_file: .env
    user: "10001:10001"
    working_dir: /workspace
    stdin_open: true
    tty: true
    volumes:
      # Only the project you want the agent to touch (override with PROJECT_DIR)
      - ${PROJECT_DIR:-./workspace}:/workspace
      # Pi config + sessions persist here
      - pi-data:/home/pi/.pi
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      # Rest of HOME (caches etc.); ephemeral
      - /home/pi:size=64m,uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    extra_hosts:
      # Lets the container reach a model server running on the Docker host (Linux)
      - "host.docker.internal:host-gateway"
    pids_limit: 256
    mem_limit: 2g

volumes:
  pi-data:
